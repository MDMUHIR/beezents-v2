    <rect x="180" y="284" width="152" height="26" rx="13" fill="url(#bzFullGrad)" />
    <rect x="186" y="324" width="140" height="26" rx="13" fill="url(#bzFullGrad)" />
    <rect x="198" y="364" width="116" height="26" rx="13" fill="url(#bzFullGrad)" />
