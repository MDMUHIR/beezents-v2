  <!-- Wordmark "BEEZENT" -->
  <text x="56" y="32" fill="#0F172A" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" letter-spacing="0.04em">BEEZENT</text>
